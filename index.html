<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3b241d" />
    <meta
      name="description"
      content="KP Cafe — your cozy coffee stop. Fresh espresso, warm pastries, crepes, bagels and roasted coffee bags. Dine in, take away or order ahead."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>KP Cafe — Cozy Coffee, Fresh Pastries & Roasted Beans</title>
    <script>
      window.__VITE_REACT_LOADED__ = false;
    </script>
  </head>
  <body>
    <div id="root">
      <noscript>
        <div style="padding: 24px; font-family: sans-serif; text-align: center; background: #fdf9f4; color: #3b241d;">
          Please enable JavaScript or open <a href="./kp-cafe.html" style="color: #855943; font-weight: bold;">kp-cafe.html</a>.
        </div>
      </noscript>
      <!-- Helper for VS Code Live Server users when raw .tsx fails in browser -->
      <div id="live-server-helper" style="display: none; min-height: 100vh; background: #fdf9f4; color: #3b241d; font-family: system-ui, sans-serif; padding: 40px 20px; text-align: center;">
        <div style="max-width: 540px; margin: 40px auto; background: #ffffff; border: 1px solid #e5c9a6; border-radius: 24px; padding: 32px 24px; box-shadow: 0 20px 40px rgba(59,36,29,0.08);">
          <div style="font-size: 32px; margin-bottom: 12px;">☕</div>
          <h2 style="font-size: 22px; margin: 0 0 10px; color: #3b241d;">KP Cafe — Opening with Live Server...</h2>
          <p style="font-size: 14px; line-height: 1.6; color: #6b4433; margin: 0 0 20px;">
            Redirecting to <strong>kp-cafe.html</strong> (standalone version)...
          </p>
          <a href="./kp-cafe.html" style="display: inline-block; background: #3b241d; color: #fdf9f4; padding: 12px 24px; border-radius: 99px; text-decoration: none; font-weight: 600; font-size: 14px;">
            Click here if not redirected automatically
          </a>
        </div>
      </div>
      <script>
        setTimeout(function() {
          if (!window.__VITE_REACT_LOADED__) {
            var helper = document.getElementById('live-server-helper');
            if (helper) helper.style.display = 'block';
            if (window.location.pathname.indexOf('/dist/') === -1 && window.location.protocol !== 'file:') {
              window.location.href = './kp-cafe.html';
            }
          }
        }, 1200);
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
